<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Status Check - VY Group</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 16px;
    }
    
    .content {
      padding: 40px 30px;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .help-text {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
    }
    
    .button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .button:active {
      transform: translateY(0);
    }
    
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .result {
      margin-top: 30px;
      padding: 24px;
      border-radius: 12px;
      display: none;
    }
    
    .result.success {
      background: #ecfdf5;
      border: 2px solid #10b981;
    }
    
    .result.error {
      background: #fef2f2;
      border: 2px solid #ef4444;
    }
    
    .result.warning {
      background: #fffbeb;
      border: 2px solid #f59e0b;
    }
    
    .result-header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .result-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 20px;
    }
    
    .result.success .result-icon {
      background: #10b981;
      color: white;
    }
    
    .result.error .result-icon {
      background: #ef4444;
      color: white;
    }
    
    .result.warning .result-icon {
      background: #f59e0b;
      color: white;
    }
    
    .result-title {
      font-size: 20px;
      font-weight: 700;
    }
    
    .result.success .result-title {
      color: #065f46;
    }
    
    .result.error .result-title {
      color: #991b1b;
    }
    
    .result.warning .result-title {
      color: #92400e;
    }
    
    .info-grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: white;
      border-radius: 8px;
    }
    
    .info-label {
      font-weight: 600;
      color: #6b7280;
    }
    
    .info-value {
      color: #111827;
      font-weight: 500;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .badge.active {
      background: #d1fae5;
      color: #065f46;
    }
    
    .badge.expired {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .badge.grace {
      background: #fef3c7;
      color: #92400e;
    }
    
    .features-list {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 8px;
    }
    
    .features-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: #374151;
    }
    
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }
    
    .feature-item {
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      color: #374151;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 14px;
      border-top: 1px solid #e5e7eb;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>License Status Check</h1>
      <p>Enter your license key to view your subscription details</p>
    </div>
    
    <div class="content">
      <form id="checkForm">
        <div class="form-group">
          <label for="licenseKey">License Key</label>
          <input 
            type="text" 
            id="licenseKey" 
            placeholder="HRMS2-xxxxxxxxxx..." 
            required
            autocomplete="off"
          >
          <div class="help-text">
            Your license key starts with "HRMS2-" and was provided when you purchased your subscription
          </div>
        </div>
        
        <button type="submit" class="button" id="checkButton">
          Check License Status
        </button>
      </form>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Validating license...</div>
      </div>
      
      <div class="result" id="result"></div>
    </div>
    
    <div class="footer">
      <p>
        <strong>VY Group</strong> | License Management Portal<br>
        Need help? Contact <a href="mailto:support@vygroup.com">support@vygroup.com</a>
      </p>
    </div>
  </div>
  
  <script>
    function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    const form = document.getElementById('checkForm');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const checkButton = document.getElementById('checkButton');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const licenseKey = document.getElementById('licenseKey').value.trim();
      
      if (!licenseKey) {
        showError('Please enter a license key');
        return;
      }
      
      // Show loading
      loading.style.display = 'block';
      result.style.display = 'none';
      checkButton.disabled = true;
      
      try {
        const response = await fetch('/api/licenses/validate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ license_key: licenseKey })
        });
        
        const data = await response.json();
        
        if (response.ok && data.valid) {
          showSuccess(data);
        } else {
          showError(data.error || 'Invalid license key');
        }
      } catch (error) {
        showError('Failed to validate license. Please try again.');
      } finally {
        loading.style.display = 'none';
        checkButton.disabled = false;
      }
    });
    
    function showSuccess(data) {
      const { payload } = data;
      const now = Math.floor(Date.now() / 1000);
      const daysRemaining = Math.ceil((payload.exp - now) / 86400);
      const isExpired = payload.exp < now;
      const isExpiringSoon = daysRemaining <= 30 && daysRemaining > 0;
      
      let statusClass = 'success';
      let statusIcon = '✓';
      let statusTitle = 'License Active';
      let statusBadge = '<span class="badge active">Active</span>';
      
      if (isExpired) {
        statusClass = 'error';
        statusIcon = '✕';
        statusTitle = 'License Expired';
        statusBadge = '<span class="badge expired">Expired</span>';
      } else if (isExpiringSoon) {
        statusClass = 'warning';
        statusIcon = '⚠';
        statusTitle = 'License Expiring Soon';
        statusBadge = '<span class="badge grace">Expiring Soon</span>';
      }
      
      const expiryDate = new Date(payload.exp * 1000).toLocaleDateString();
      const issuedDate = new Date(payload.iat * 1000).toLocaleDateString();
      
      result.className = `result ${statusClass}`;
      result.innerHTML = `
        <div class="result-header">
          <div class="result-icon">${statusIcon}</div>
          <div class="result-title">${statusTitle}</div>
        </div>
        
        <div class="info-grid">
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="info-value">${statusBadge}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Customer:</span>
            <span class="info-value">${escapeHtml(payload.customer || 'N/A')}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Plan:</span>
            <span class="info-value">${escapeHtml(payload.plan_label || payload.plan)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Issued:</span>
            <span class="info-value">${issuedDate}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Expires:</span>
            <span class="info-value">${expiryDate}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Days Remaining:</span>
            <span class="info-value">${isExpired ? '0 (Expired)' : daysRemaining + ' days'}</span>
          </div>
          ${payload.max_employees ? `
          <div class="info-row">
            <span class="info-label">Employee Limit:</span>
            <span class="info-value">${payload.max_employees === 0 ? 'Unlimited' : escapeHtml(payload.max_employees)}</span>
          </div>
          ` : ''}
        </div>
        
        ${payload.features && payload.features.length > 0 ? `
        <div class="features-list">
          <div class="features-title">Included Features (${payload.features.length})</div>
          <div class="features-grid">
            ${payload.features.map(f => `<div class="feature-item">${escapeHtml(formatFeature(f))}</div>`).join('')}
          </div>
        </div>
        ` : ''}
        
        ${isExpiringSoon || isExpired ? `
        <div style="margin-top: 20px; padding: 16px; background: white; border-radius: 8px; text-align: center;">
          <p style="margin-bottom: 12px; color: #374151;">
            ${isExpired ? 'Your license has expired. Contact us to renew.' : 'Your license is expiring soon. Renew now to avoid interruption.'}
          </p>
          <a href="mailto:${escapeHtml(payload.vendor_email || 'support@vygroup.com')}?subject=License Renewal - ${escapeHtml(payload.license_id)}" 
             style="display: inline-block; padding: 10px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
            Contact Support
          </a>
        </div>
        ` : ''}
      `;
      
      result.style.display = 'block';
    }
    
    function showError(message) {
      result.className = 'result error';
      result.innerHTML = `
        <div class="result-header">
          <div class="result-icon">✕</div>
          <div class="result-title">Invalid License</div>
        </div>
        <p style="margin-top: 12px; color: #991b1b;">${escapeHtml(message)}</p>
        <p style="margin-top: 12px; color: #6b7280; font-size: 14px;">
          Please check your license key and try again. If you continue to have issues, contact support.
        </p>
      `;
      result.style.display = 'block';
    }
    
    function formatFeature(feature) {
      return feature
        .split('_')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
  </script>
</body>
</html>
